name: lockfile

# One-off: npm resolves package-lock.json on CI and commits it to this branch.
# Removed again before the branch is merged.
on:
  push:
    branches: [chore/checks]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add package-lock.json, resolved by npm on CI"
          git push
